<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente de Compras</title>
  <style>
    :root {
      --fondo: #f4f5f7; --panel: #fff; --texto: #1d2330; --suave: #687087; --borde: #dde0e6;
      --primario: #2350c8; --ok: #1b7f4b; --falla: #c0352b; --alerta: #b7791f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--fondo); color: var(--texto);
           display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--borde);
             display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { font-size: 17px; margin: 0; }
    #uso { font-size: 12px; color: var(--suave); text-align: right; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
            max-width: 900px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; max-width: 85%; }
    .usuario { align-self: flex-end; background: var(--primario); color: #fff; }
    .agente { align-self: flex-start; background: var(--panel); border: 1px solid var(--borde); }
    .agente.confirmar { border: 2px solid var(--alerta); background: #fff8e6; }
    .agente.md { white-space: normal; }
    .agente.md p { margin: 6px 0; } .agente.md ul { margin: 6px 0; padding-left: 20px; }
    .agente.md table { border-collapse: collapse; margin: 6px 0; font-size: 14px; }
    .agente.md th, .agente.md td { border: 1px solid var(--borde); padding: 4px 8px; text-align: left; }
    .agente.md code { background: #eef1f8; padding: 1px 4px; border-radius: 4px; }
    .error { align-self: center; color: var(--falla); font-size: 13px; }
    details.tool { align-self: flex-start; max-width: 85%; background: #eef1f8; border: 1px solid #d3d9ea;
                   border-radius: 8px; font-size: 13px; }
    details.tool summary { padding: 6px 10px; cursor: pointer; }
    details.tool pre { margin: 0; padding: 8px 10px; overflow-x: auto; max-height: 320px;
                       border-top: 1px solid #d3d9ea; font-size: 12px; white-space: pre-wrap; }
    .ok { color: var(--ok); } .ko { color: var(--falla); }
    .banner { align-self: stretch; background: #fff8e6; border: 1px solid #f0d48a; border-radius: 10px; padding: 10px 14px; }
    .banner button { margin: 6px 8px 0 0; }
    form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--borde); }
    input { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid var(--borde); border-radius: 8px; min-width: 0; }
    button { padding: 10px 16px; font: inherit; border: 0; border-radius: 8px; cursor: pointer; background: var(--primario); color: #fff; }
    button.si { background: var(--ok); } button.no { background: var(--falla); }
    button:disabled { opacity: .5; cursor: default; }
    .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; }
    .sugerencias button { background: var(--panel); color: var(--primario); border: 1px solid var(--borde); font-size: 13px; padding: 6px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Agente de Compras · Órdenes de compra SAP</h1>
    <div id="uso">0 tokens · USD 0.0000</div>
  </header>

  <main id="chat">
    <div class="msg agente">Hola. Leo las solicitudes de compra, las valido contra los maestros (RC1–RC10) y creo la orden de compra en SAP. Las excepciones te las consulto antes de crear.</div>
    <div class="sugerencias">
      <button type="button">Procesa la solicitud "sol-001"</button>
      <button type="button">Procesa la solicitud "sol-004". Muéstrame la OC como quedaría en SAP, qué validaciones pasó y cuáles no, y no la crees hasta que yo lo confirme.</button>
      <button type="button">Procesa "sol-003"</button>
      <button type="button">Procesa "sol-005"</button>
    </div>
  </main>

  <form id="form">
    <input id="entrada" placeholder="Escribe tu mensaje… (ej.: procesa sol-002)" autocomplete="off">
    <button id="enviar">Enviar</button>
  </form>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
  // Un id por pestaña: el backend guarda la sesión con este id (GET /api/sessions/:id).
  const sessionId = crypto.randomUUID();
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const botonEnviar = document.getElementById("enviar");

  function agregar(clase, texto) {
    const div = document.createElement("div");
    div.className = clase;
    div.textContent = texto; // textContent (no innerHTML): evita inyectar HTML
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // Respuesta del agente en markdown, sanitizada con DOMPurify. Si las librerías no cargan, texto plano.
  function agregarMarkdown(clase, texto) {
    if (!window.marked || !window.DOMPurify) return agregar(clase, texto);
    const div = document.createElement("div");
    div.className = clase + " md";
    div.innerHTML = DOMPurify.sanitize(marked.parse(texto));
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function resumir(valor) {
    const texto = typeof valor === "string" ? valor : JSON.stringify(valor, null, 2);
    return texto.length > 3000 ? texto.slice(0, 3000) + "\n…" : texto;
  }

  // Cada llamada a herramienta: nombre, argumentos y resultado (desplegable).
  function mostrarHerramienta(t) {
    const det = document.createElement("details");
    det.className = "tool";
    const sum = document.createElement("summary");
    sum.textContent = `🔧 ${t.herramienta} ${t.ok ? "✔" : "✖"}`;
    sum.className = t.ok ? "ok" : "ko";
    const pre = document.createElement("pre");
    pre.textContent = "Argumentos:\n" + resumir(t.args) + "\n\nResultado:\n" + resumir(t.resultado);
    det.append(sum, pre);
    chat.appendChild(det);
  }

  // Estado "esperando confirmación": se resalta y se ofrecen respuestas rápidas.
  function mostrarBanner() {
    const caja = document.createElement("div");
    caja.className = "banner";
    caja.innerHTML = "<b>❓ El agente espera tu confirmación.</b> Responde explícitamente:<br>";
    const si = Object.assign(document.createElement("button"), { className: "si", textContent: "Confirmo" });
    const no = Object.assign(document.createElement("button"), { className: "no", textContent: "No confirmo" });
    const responder = (texto) => { si.disabled = no.disabled = true; enviar(texto); };
    si.onclick = () => responder("Confirmo");
    no.onclick = () => responder("No confirmo, no crees la OC");
    caja.append(si, no);
    chat.appendChild(caja);
    chat.scrollTop = chat.scrollHeight;
  }

  async function enviar(texto) {
    agregar("msg usuario", texto);
    ocupado(true);
    const pensando = agregar("msg agente", "Pensando…");
    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, message: texto }),
      });
      const datos = await resp.json();
      pensando.remove();
      if (!resp.ok) return agregar("error", datos.error || "Error en el servidor");

      datos.toolCalls.forEach(mostrarHerramienta);
      if (datos.reply) agregarMarkdown("msg agente" + (datos.needsConfirmation ? " confirmar" : ""), datos.reply);
      if (datos.needsConfirmation) mostrarBanner();
      const u = datos.uso;
      document.getElementById("uso").textContent =
        `${u.tokens.toLocaleString("es-CO")} / ${u.tokensMax.toLocaleString("es-CO")} tokens · USD ${u.costoUsd.toFixed(4)}`;
    } catch {
      pensando.remove();
      agregar("error", "No se pudo conectar con el servidor.");
    } finally {
      ocupado(false);
    }
  }

  function ocupado(si) {
    entrada.disabled = botonEnviar.disabled = si;
    if (!si) entrada.focus();
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;
    entrada.value = "";
    enviar(texto);
  });

  document.querySelectorAll(".sugerencias button").forEach((b) =>
    b.addEventListener("click", () => enviar(b.textContent)));
</script>
</body>
</html>
