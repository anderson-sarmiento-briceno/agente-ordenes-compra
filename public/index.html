<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente de Compras</title>
  <style>
    :root {
      --fondo: #f4f5f7; --panel: #fff; --texto: #1d2330; --suave: #687087; --borde: #dde0e6;
      --primario: #2350c8; --ok: #1b7f4b; --falla: #c0352b; --alerta: #b7791f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--fondo); color: var(--texto);
           display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--borde);
             display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header h1 { font-size: 17px; margin: 0; }
    #uso { font-size: 12px; color: var(--suave); text-align: right; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
            max-width: 900px; width: 100%; margin: 0 auto; }
    .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; max-width: 85%; }
    .usuario { align-self: flex-end; background: var(--primario); color: #fff; }
    .agente { align-self: flex-start; background: var(--panel); border: 1px solid var(--borde); }
    .error { align-self: center; color: var(--falla); font-size: 13px; }
    details.tool { align-self: flex-start; max-width: 85%; background: #eef1f8; border: 1px solid #d3d9ea;
                   border-radius: 8px; font-size: 13px; }
    details.tool summary { padding: 6px 10px; cursor: pointer; }
    details.tool pre { margin: 0; padding: 8px 10px; overflow-x: auto; max-height: 300px;
                       border-top: 1px solid #d3d9ea; font-size: 12px; }
    .estado-ejecutada { color: var(--ok); } .estado-rechazada { color: var(--falla); } .estado-pendiente { color: var(--alerta); }
    .confirmacion { align-self: stretch; background: #fff8e6; border: 1px solid #f0d48a; border-radius: 10px; padding: 12px 14px; }
    .confirmacion pre { font-size: 12px; white-space: pre-wrap; }
    .confirmacion button { margin-right: 8px; }
    form { display: flex; gap: 8px; padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--borde); }
    input { flex: 1; padding: 10px 12px; font: inherit; border: 1px solid var(--borde); border-radius: 8px; min-width: 0; }
    button { padding: 10px 16px; font: inherit; border: 0; border-radius: 8px; cursor: pointer; background: var(--primario); color: #fff; }
    button.aprobar { background: var(--ok); } button.rechazar { background: var(--falla); }
    button:disabled { opacity: .5; cursor: default; }
    .sugerencias { display: flex; flex-wrap: wrap; gap: 6px; }
    .sugerencias button { background: var(--panel); color: var(--primario); border: 1px solid var(--borde); font-size: 13px; padding: 6px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Agente de Compras · Órdenes de compra SAP</h1>
    <div id="uso">0 tokens · USD 0.0000</div>
  </header>

  <main id="chat">
    <div class="msg agente">Hola. Puedo revisar las solicitudes de compra, validar sus controles y crear la orden de compra en SAP cuando tú lo apruebes.</div>
    <div class="sugerencias">
      <button type="button">¿Qué solicitudes hay pendientes?</button>
      <button type="button">Valida la solicitud sol-001</button>
      <button type="button">Procesa todas las solicitudes</button>
    </div>
  </main>

  <form id="form">
    <input id="entrada" placeholder="Escribe tu mensaje…" autocomplete="off">
    <button id="enviar">Enviar</button>
  </form>

<script>
  // Un id por pestaña: el backend guarda el historial de la conversación con este id.
  const sesionId = crypto.randomUUID();
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const entrada = document.getElementById("entrada");
  const botonEnviar = document.getElementById("enviar");

  function agregar(clase, texto) {
    const div = document.createElement("div");
    div.className = clase;
    div.textContent = texto; // textContent (no innerHTML): evita inyectar HTML
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // Cada llamada a herramienta se muestra como un bloque desplegable con su entrada y su resultado.
  function mostrarHerramienta(h) {
    const det = document.createElement("details");
    det.className = "tool";
    const sum = document.createElement("summary");
    sum.innerHTML = `🔧 <b></b> <span class="estado-${h.estado}">(${h.estado})</span>`;
    sum.querySelector("b").textContent = h.nombre;
    const pre = document.createElement("pre");
    pre.textContent = "Entrada:\n" + JSON.stringify(h.input, null, 2) +
      (h.resultado ? "\n\nResultado:\n" + JSON.stringify(h.resultado, null, 2) : "");
    det.append(sum, pre);
    chat.appendChild(det);
  }

  function mostrarConfirmacion(acciones) {
    const caja = document.createElement("div");
    caja.className = "confirmacion";
    caja.innerHTML = "<b>⚠️ Se requiere tu confirmación</b><p>El agente quiere ejecutar una acción que escribe en SAP:</p><pre></pre>";
    caja.querySelector("pre").textContent = acciones.map(a => `${a.nombre} ${JSON.stringify(a.input)}`).join("\n");
    const aprobar = Object.assign(document.createElement("button"), { className: "aprobar", textContent: "Aprobar" });
    const rechazar = Object.assign(document.createElement("button"), { className: "rechazar", textContent: "Rechazar" });
    const decidir = (aprobado) => {
      aprobar.disabled = rechazar.disabled = true;
      caja.querySelector("b").textContent = aprobado ? "✅ Aprobado por el usuario" : "❌ Rechazado por el usuario";
      llamarApi("/api/confirmar", { sesionId, aprobado });
    };
    aprobar.onclick = () => decidir(true);
    rechazar.onclick = () => decidir(false);
    caja.append(aprobar, rechazar);
    chat.appendChild(caja);
    chat.scrollTop = chat.scrollHeight;
  }

  async function llamarApi(ruta, cuerpo) {
    ocupado(true);
    const pensando = agregar("msg agente", "Pensando…");
    let esperaConfirmacion = false;
    try {
      const resp = await fetch(ruta, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo) });
      const datos = await resp.json();
      pensando.remove();
      if (!resp.ok) return agregar("error", datos.error || "Error en el servidor");

      datos.herramientas.forEach(mostrarHerramienta);
      if (datos.texto) agregar("msg agente", datos.texto);
      if (datos.confirmacion) { mostrarConfirmacion(datos.confirmacion); esperaConfirmacion = true; }
      const u = datos.uso;
      document.getElementById("uso").textContent =
        `${(u.inputTokens + u.outputTokens).toLocaleString("es-CO")} tokens · USD ${u.costoUsd.toFixed(4)}`;
    } catch (e) {
      pensando.remove();
      agregar("error", "No se pudo conectar con el servidor.");
    } finally {
      // Mientras haya una confirmación pendiente no se permite escribir.
      ocupado(esperaConfirmacion);
    }
  }

  function ocupado(si) {
    entrada.disabled = botonEnviar.disabled = si;
    if (!si) entrada.focus();
  }

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const texto = entrada.value.trim();
    if (!texto) return;
    entrada.value = "";
    agregar("msg usuario", texto);
    llamarApi("/api/chat", { sesionId, mensaje: texto });
  });

  document.querySelectorAll(".sugerencias button").forEach((b) =>
    b.addEventListener("click", () => { entrada.value = b.textContent; form.requestSubmit(); }));
</script>
</body>
</html>
